<script>
(() => {
"use strict";

// ---- config: panels & series (color follows the entity, fixed order) --------
const SEASON_WASH = {winter:"var(--s-winter)", spring:"var(--s-spring)", summer:"var(--s-summer)", fall:"var(--s-fall)"};
const PANELS = [
  {
    id:"temp", title:"Temperature (°C)", kind:"temp", zero:0,
    series:[{key:"temp", name:"temp", color:"var(--orange)", raw:true}]
  },
  {
    id:"ground", title:"Precipitation & ground  (0–1)", kind:"unit",
    series:[
      {key:"rain",   name:"rain",   color:"var(--blue)"},
      {key:"leaves", name:"leaves", color:"var(--orange)"},
      {key:"snow",   name:"snow",   color:"var(--aqua)", clamp0:true},
    ]
  },
  {
    id:"drivers", title:"Drivers  (0–1)", kind:"unit",
    series:[
      {key:"humidity", name:"humidity", color:"var(--blue)"},
      {key:"clouds",   name:"clouds",   color:"var(--orange)"},
      {key:"wind",     name:"wind",     color:"var(--aqua)"},
    ]
  },
];
const FMT = {temp:v=>v.toFixed(1)+"°", default:v=>v.toFixed(2)};

let DATA = null;         // parsed json
let S = [];              // samples
let seasonRuns = [];     // [{season,x0,x1}]
let xMin=0, xMax=1;
const off = new Set();   // hidden "panel.key"

// ---- geometry ---------------------------------------------------------------
const W = 1000, PADL = 46, PADR = 14, PADT = 16, PADB = 22, PH = 150;

function xScale(t){ return PADL + (t - xMin) / (xMax - xMin || 1) * (W - PADL - PADR); }

function panelYScale(p){
  if(p.kind === "temp"){
    let lo=Infinity, hi=-Infinity;
    for(const r of S){ const v=r.temp; if(v<lo)lo=v; if(v>hi)hi=v; }
    lo = Math.min(lo, 0); hi = Math.max(hi, 0);
    const pad = (hi-lo)*0.08 || 1; lo-=pad; hi+=pad;
    return {lo, hi, y:v => PADT + (1-(v-lo)/((hi-lo)||1))*(PH-PADT-PADB)};
  }
  const lo=0, hi=1;
  return {lo, hi, y:v => PADT + (1-(v-lo)/(hi-lo))*(PH-PADT-PADB)};
}

function val(r, s){
  let v = r[s.key];
  if(v === undefined || v === null) return null;
  if(s.clamp0) v = Math.max(0, v);
  return v;
}

// ---- season runs ------------------------------------------------------------
function computeSeasons(){
  seasonRuns = [];
  if(!S.length) return;
  let cur = S[0].season, x0 = S[0].t;
  for(let i=1;i<S.length;i++){
    if(S[i].season !== cur){
      seasonRuns.push({season:cur, x0, x1:S[i].t});
      cur = S[i].season; x0 = S[i].t;
    }
  }
  seasonRuns.push({season:cur, x0, x1:S[S.length-1].t});
}

// ---- rendering --------------------------------------------------------------
function svgEl(tag, attrs){
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function renderPanel(p){
  const sc = panelYScale(p);
  const ns = "http://www.w3.org/2000/svg";
  const svg = svgEl("svg", {viewBox:`0 0 ${W} ${PH}`, role:"img"});

  // season washes + boundaries
  for(const run of seasonRuns){
    const x0 = xScale(run.x0), x1 = xScale(run.x1);
    svg.appendChild(svgEl("rect", {x:x0, y:PADT, width:Math.max(0,x1-x0),
      height:PH-PADT-PADB, fill:SEASON_WASH[run.season] || "transparent"}));
  }

  // y gridlines + ticks
  const g = svgEl("g", {class:"grid"});
  const ticks = sc.lo<0 || p.kind==="temp"
      ? niceTicks(sc.lo, sc.hi, 4)
      : [0,0.25,0.5,0.75,1];
  for(const tv of ticks){
    const yy = sc.y(tv);
    g.appendChild(svgEl("line",{x1:PADL, y1:yy, x2:W-PADR, y2:yy}));
    const lab = svgEl("text",{x:PADL-6, y:yy+3, class:"tick", "text-anchor":"end"});
    lab.textContent = p.kind==="temp" ? tv.toFixed(0) : tv.toFixed(2);
    svg.appendChild(lab);
  }
  svg.appendChild(g);

  // zero / freezing reference for temp
  if(p.kind==="temp"){
    const yz = sc.y(0);
    svg.appendChild(svgEl("line",{x1:PADL,y1:yz,x2:W-PADR,y2:yz,class:"zero"}));
    const zl = svgEl("text",{x:W-PADR, y:yz-4, class:"tick", "text-anchor":"end", fill:"var(--warn)"});
    zl.textContent = "0° freezing";
    svg.appendChild(zl);
  }

  // series polylines
  for(const s of p.series){
    if(off.has(p.id+"."+s.key)) continue;
    let d = "";
    for(const r of S){
      const v = val(r, s); if(v===null) continue;
      const X = xScale(r.t).toFixed(1), Y = sc.y(v).toFixed(1);
      d += (d ? "L" : "M") + X + " " + Y;
    }
    svg.appendChild(svgEl("path",{d, fill:"none", stroke:s.color,
      "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round"}));
  }

  // crosshair (hidden until hover)
  const cross = svgEl("line",{class:"crosshair", x1:0,y1:PADT,x2:0,y2:PH-PADB, opacity:0});
  cross.dataset.role = "cross";
  svg.appendChild(cross);

  return svg;
}

function niceTicks(lo, hi, n){
  const span = hi-lo || 1;
  const step = Math.pow(10, Math.floor(Math.log10(span/n)));
  const err = (span/n)/step;
  const mult = err>=7.5?10:err>=3?5:err>=1.5?2:1;
  const s = step*mult;
  const out=[]; let v = Math.ceil(lo/s)*s;
  for(; v<=hi+1e-9; v+=s) out.push(Math.round(v*1e6)/1e6);
  return out;
}

function renderAxis(){
  const svg = svgEl("svg",{viewBox:`0 0 ${W} 34`});
  svg.appendChild(svgEl("line",{x1:PADL,y1:1,x2:W-PADR,y2:1,stroke:"var(--axis)"}));
  const secs = niceTicks(xMin, xMax, 8);
  for(const tv of secs){
    const X = xScale(tv);
    svg.appendChild(svgEl("line",{x1:X,y1:1,x2:X,y2:5,stroke:"var(--axis)"}));
    const lab = svgEl("text",{x:X,y:16,class:"tick","text-anchor":"middle"});
    lab.textContent = tv+"s";
    svg.appendChild(lab);
  }
  // season labels centered on each run
  for(const run of seasonRuns){
    const cx = (xScale(run.x0)+xScale(run.x1))/2;
    const lab = svgEl("text",{x:cx,y:30,class:"season-lab"});
    lab.textContent = run.season;
    svg.appendChild(lab);
  }
  return svg;
}

function renderLegend(p){
  const wrap = document.createElement("div");
  wrap.className = "legend";
  for(const s of p.series){
    const el = document.createElement("span");
    el.className = "lg" + (off.has(p.id+"."+s.key) ? " off" : "");
    el.innerHTML = `<span class="sw" style="background:${s.color}"></span>${s.name}`;
    el.onclick = () => {
      const id = p.id+"."+s.key;
      if(off.has(id)) off.delete(id); else off.add(id);
      draw();
    };
    wrap.appendChild(el);
  }
  return wrap;
}

// ---- hover / crosshair ------------------------------------------------------
let panelSvgs = [];
function bindHover(container){
  const tip = document.getElementById("tip");
  function move(ev){
    const first = panelSvgs[0]; if(!first) return;
    const rect = first.getBoundingClientRect();
    const scaleX = W / rect.width;
    const px = (ev.clientX - rect.left) * scaleX;
    const t = xMin + (px - PADL)/((W-PADL-PADR)||1) * (xMax-xMin);
    // nearest sample
    let idx = 0, best = Infinity;
    for(let i=0;i<S.length;i++){ const dd = Math.abs(S[i].t - t); if(dd<best){best=dd; idx=i;} }
    const r = S[idx]; if(!r){ return; }
    const cx = xScale(r.t);
    for(const svg of panelSvgs){
      const c = svg.querySelector('[data-role="cross"]');
      if(c){ c.setAttribute("x1",cx); c.setAttribute("x2",cx); c.setAttribute("opacity",1); }
    }
    let rows = "";
    for(const p of PANELS) for(const s of p.series){
      if(off.has(p.id+"."+s.key)) continue;
      const v = r[s.key]; if(v===undefined||v===null) continue;
      const disp = s.raw ? v.toFixed(1)+"°" : v.toFixed(2);
      rows += `<div class="tr"><span class="nm"><span class="sw" style="background:${s.color}"></span>${s.name}</span><span>${disp}</span></div>`;
    }
    tip.innerHTML = `<div class="tt"><span>t = ${r.t}s</span><span>${r.season}</span></div>${rows}`;
    tip.style.opacity = 1;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = ev.clientX + 14, ly = ev.clientY - th - 8;
    if(lx + tw > innerWidth - 8) lx = ev.clientX - tw - 14;
    if(ly < 8) ly = ev.clientY + 16;
    tip.style.left = lx+"px"; tip.style.top = ly+"px";
  }
  function leave(){
    document.getElementById("tip").style.opacity = 0;
    for(const svg of panelSvgs){ const c=svg.querySelector('[data-role="cross"]'); if(c) c.setAttribute("opacity",0); }
  }
  container.addEventListener("pointermove", move);
  container.addEventListener("pointerleave", leave);
}

// ---- top-level draw ---------------------------------------------------------
function draw(){
  const charts = document.getElementById("charts");
  charts.innerHTML = "";
  panelSvgs = [];
  for(const p of PANELS){
    const panel = document.createElement("div");
    panel.className = "panel";
    const head = document.createElement("div");
    head.className = "phead";
    const ttl = document.createElement("span"); ttl.className="ptitle"; ttl.textContent=p.title;
    head.appendChild(ttl);
    head.appendChild(renderLegend(p));
    panel.appendChild(head);
    const svg = renderPanel(p);
    panelSvgs.push(svg);
    panel.appendChild(svg);
    charts.appendChild(panel);
  }
  const axisPanel = document.createElement("div");
  axisPanel.className = "panel";
  axisPanel.style.paddingTop = "4px";
  axisPanel.appendChild(renderAxis());
  charts.appendChild(axisPanel);
  bindHover(charts);
}

function renderTiles(){
  const st = DATA.stats || {};
  const tiles = [
    ["Year length", (DATA.year_minutes ?? "?")+"<small> min</small>"],
    ["Years logged", (DATA.years_covered ?? "?")+"<small> ×</small>"],
    ["Snow", (st.snow_pct_of_year ?? 0)+"<small>% of yr</small>"],
    ["Rain", (st.rain_pct_of_year ?? 0)+"<small>% of yr</small>"],
    ["Leaves", (st.leaves_pct_of_year ?? 0)+"<small>% of yr</small>"],
    ["Temp range", (st.temp_min ?? "?")+"<small> .. </small>"+(st.temp_max ?? "?")+"<small>°C</small>"],
  ];
  document.getElementById("tiles").innerHTML =
    tiles.map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function renderTable(){
  const cols = ["t","season","temp","humidity","clouds","wind","rain","snow","leaves"];
  let h = "<table><thead><tr>"+cols.map(c=>`<th>${c}</th>`).join("")+"</tr></thead><tbody>";
  for(const r of S){
    h += "<tr>"+cols.map(c=>{
      const v=r[c];
      return `<td>${typeof v==="number"? (Number.isInteger(v)? v : v.toFixed(2)) : v}</td>`;
    }).join("")+"</tr>";
  }
  h += "</tbody></table>";
  document.getElementById("tableView").innerHTML = h;
}

function load(json){
  DATA = json;
  S = (json.samples||[]).slice().sort((a,b)=>a.t-b.t);
  if(!S.length){ document.getElementById("sub").textContent = "No samples in file."; return; }
  xMin = S[0].t; xMax = S[S.length-1].t;
  computeSeasons();
  const st = json.stats||{};
  document.getElementById("sub").innerHTML =
    `${S.length} samples · ${json.duration_s ?? "?"}s over ${json.years_covered ?? "?"} year(s) `+
    `· sampled every ${json.interval_s ?? "?"}s`;
  document.getElementById("hint").textContent =
    "Click a legend key to hide/show a series. Hover for values. Background bands = seasons.";
  renderTiles();
  draw();
  renderTable();
}

// ---- file loading -----------------------------------------------------------
function readFile(f){
  const rd = new FileReader();
  rd.onload = () => { try{ load(JSON.parse(rd.result)); }catch(e){ document.getElementById("sub").textContent = "Parse error: "+e.message; } };
  rd.readAsText(f);
}
const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
drop.onclick = () => fileInput.click();
fileInput.onchange = e => { if(e.target.files[0]) readFile(e.target.files[0]); };
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.add("hot");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove("hot");}));
drop.addEventListener("drop", e=>{ if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
document.body.addEventListener("dragover",e=>e.preventDefault());
document.body.addEventListener("drop",e=>{ e.preventDefault(); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });

function tryFetch(){
  fetch("env_log.json", {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(load)
    .catch(()=>{ document.getElementById("sub").textContent =
      "Drop env_log.json onto the box above (browsers block auto-loading a sibling file from disk)."; });
}
document.getElementById("reload").onclick = tryFetch;

// When exported as a self-contained report the log is injected as window.__ENV_LOG__
// (see the marker in <head>); otherwise fall back to drop / fetch of a sibling file.

// ---- controls ---------------------------------------------------------------
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", isDark ? "light" : "dark");
};
document.getElementById("tableBtn").onclick = () => {
  const t = document.getElementById("tableView");
  const c = document.getElementById("charts");
  const show = t.classList.contains("hidden");
  t.classList.toggle("hidden", !show);
  c.classList.toggle("hidden", show);
};

if (window.__ENV_LOG__) { load(window.__ENV_LOG__); }
else { tryFetch(); }
})();
</script>
</body>
</html>
